name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure Android SDK platform 37
        run: |
          SDK="$ANDROID_HOME"
          rm -rf "$SDK/platforms/android-37"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          cp -r "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          printf '%s\n' \
            'AndroidVersion.ApiLevel=37' \
            'Pkg.Id=platforms;android-37' \
            'Pkg.Path=platforms;android-37' \
            > "$SDK/platforms/android-37/source.properties"
          ls "$SDK/platforms" | grep -E "android-3[67]"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > keystore/release.jks
          test -s keystore/release.jks

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opiconchanger-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
