name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" >/dev/null
          mkdir -p "$ANDROID_HOME/platforms/android-37"
          cp -r "$ANDROID_HOME/platforms/android-37.0/." "$ANDROID_HOME/platforms/android-37/"
          printf '%s\n' 'AndroidVersion.ApiLevel=37' 'Pkg.Desc=Android SDK Platform 37' 'Pkg.DisplayName=Android SDK Platform 37' 'Pkg.Id=platforms;android-37' 'Pkg.Path=platforms;android-37' 'Pkg.Revision=1' > "$ANDROID_HOME/platforms/android-37/source.properties"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > keystore/release.jks
          test -s keystore/release.jks || { echo "::error::decoded keystore is empty"; exit 1; }

      - name: Assemble release APK (signed)
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opiconchanger-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
